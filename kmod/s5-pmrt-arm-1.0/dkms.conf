PACKAGE_NAME="s5-pmrt-arm"
PACKAGE_VERSION="1.0"
BUILT_MODULE_NAME[0]="s5_pmrt_arm"
# WHERE THE .ko THAT WAS JUST BUILT ENDS UP, relative to the root of the dkms tree.
# The Makefile lives in kernel/, so the .ko comes out in build/kernel/; without this
# line dkms looks in build/ and says "Build of s5_pmrt_arm.ko failed" even though the
# compile went fine. Measured on 2026-10-07: make.log says "exit code: 0" and the .ko
# is in build/kernel/, and dkms refuses all the same. dkms appends the trailing
# slash itself if it is missing.
BUILT_MODULE_LOCATION[0]="kernel/"
DEST_MODULE_LOCATION[0]="/kernel/drivers/misc"
AUTOINSTALL="yes"

# The source lives in kernel/ inside this same tree (the directory is also the
# spec's Source0, so the tarball carries this dkms.conf with it), which is why dkms
# has to be told where the Makefile is.
MAKE[0]="make -C ${kernel_source_dir} M=${dkms_tree}/${PACKAGE_NAME}/${PACKAGE_VERSION}/build/kernel modules"

# NO CLEAN, ON PURPOSE. dkms 3.x moved CLEAN to its obsolete list and says so on
# every build: "Deprecated feature: CLEAN". dkms manages the build tree itself, so
# all this line buys is a warning that teaches the reader to ignore warnings.
